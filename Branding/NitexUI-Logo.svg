<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fdcff"/>
      <stop offset="1" stop-color="#1fa8e0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="light" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#33ccff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#33ccff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="92"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- soft accent light from the top -->
    <rect x="16" y="16" width="480" height="480" fill="url(#light)"/>
  </g>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#2e2e34" stroke-width="8"/>

  <!-- N mark: glow -->
  <path d="M142 132 H202 L310 300 V132 H370 V380 H310 L202 212 V380 H142 Z"
        fill="#33ccff" opacity="0.45" filter="url(#glow)"/>
  <!-- N mark -->
  <path d="M142 132 H202 L310 300 V132 H370 V380 H310 L202 212 V380 H142 Z" fill="url(#accent)"/>

  <!-- accent line, like the options window header -->
  <rect x="142" y="410" width="228" height="10" rx="5" fill="#33ccff" opacity="0.55"/>
</svg>
